<!-- Supabase: Authentication > Email Templates > Confirm signup.
     Subject: Confirm your Snooker Lab account
     The link goes to the website, which confirms the email itself (apps/legal-site/email-confirmed.html),
     so the player never sees the Supabase address. -->
<div style="margin:0;padding:32px 16px;background:#07170f;font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif;">
  <div style="max-width:480px;margin:0 auto;background:#0b2219;border:1px solid #22493c;border-radius:18px;padding:32px 28px;">
    <p style="margin:0 0 20px;font-size:13px;font-weight:700;letter-spacing:3px;color:#c9a44c;">SNOOKER LAB</p>
    <h1 style="margin:0 0 12px;font-size:26px;line-height:1.2;color:#f4f1e8;">Confirm your email</h1>
    <p style="margin:0 0 24px;font-size:16px;line-height:1.6;color:#b3c7bf;">
      Thanks for signing up. Tap the button to confirm your email, then sign in to the app.
    </p>
    <p style="margin:0 0 28px;">
      <a href="https://snooker-lab.vercel.app/auth/confirm?token_hash={{ .TokenHash }}&type=email"
         style="display:inline-block;background:#3cc48f;color:#07170f;text-decoration:none;font-weight:700;font-size:16px;padding:14px 26px;border-radius:12px;">
        Confirm my email
      </a>
    </p>
    <p style="margin:0;font-size:13px;line-height:1.6;color:#7f9a90;">
      If you did not sign up for Snooker Lab, you can ignore this email.
    </p>
  </div>
</div>
